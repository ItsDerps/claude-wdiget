plugins { id 'com.android.application' }

android {
    namespace 'uk.dnm.dothome'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.dnm.dothome'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    // Same fixed key as the other apps so new builds install over old ones
    signingConfigs {
        fixed {
            storeFile file('../app/widget.keystore')
            storePassword 'claudewidget'
            keyAlias 'widget'
            keyPassword 'claudewidget'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
