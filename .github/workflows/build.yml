name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk ClaudeWidget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeWidget
          path: ClaudeWidget.apk
      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Claude Widget
          files: ClaudeWidget.apk
          make_latest: true
    permissions:
      contents: write
